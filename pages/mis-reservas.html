<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Reservas - Reservas de Hotel</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    .reserva-card-header {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 16px;
      align-items: start;
    }
    .reserva-card-header img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }
    @media (max-width: 600px) {
      .reserva-card-header {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="app-header"></div>

    <main class="main-content">
      <h1 class="page-title">Mis reservas</h1>

      <div id="reservasList" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px;"></div>
    </main>

    <div id="app-footer"></div>
  </div>

  <script src="../js/security.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/components.js"></script>
  <script>
    // Route Guard
    if (!SecurityUtils.requireAuth('./login.html')) {
      // Detiene la ejecución si no está autenticado
    }

    const RESERVAS_DEFAULT = [
      {
        id: 'RES-101',
        titulo: 'Habitación Doble Deluxe',
        desc: 'Habitación con dos camas semidobles, iluminación cálida, escritorio ejecutivo y baño privado.',
        imagen: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=500&q=80',
        entrada: '2026-10-02',
        salida: '2026-10-05',
        personas: '2'
      },
      {
        id: 'RES-102',
        titulo: 'Habitación Individual Estándar',
        desc: 'Espacio acogedor equipado con cama doble, aire acondicionado, TV Smart y Wi-Fi de alta velocidad.',
        imagen: 'https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=500&q=80',
        entrada: '2026-10-02',
        salida: '2026-10-05',
        personas: '2'
      }
    ];

    function getStorageKey() {
      return SecurityUtils.getUserStorageKey('reservas_activas');
    }

    function getReservas() {
      const key = getStorageKey();
      const saved = JSON.parse(localStorage.getItem(key) || 'null');
      if (!saved) {
        localStorage.setItem(key, JSON.stringify(RESERVAS_DEFAULT));
        return RESERVAS_DEFAULT;
      }
      return saved;
    }

    function renderMisReservas() {
      const lista = getReservas();
      const container = document.getElementById('reservasList');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 48px 20px;">
            <p style="font-size: 1.15rem; color: var(--texto-etiqueta); margin-bottom: 16px;">
              No tienes reservas activas en este momento.
            </p>
            <a href="../index.html" class="btn btn-purple" style="max-width: 240px; margin: 0 auto;">
              Explorar habitaciones
            </a>
          </div>
        `;
        return;
      }

      lista.forEach((res) => {
        const wrapper = document.createElement('div');
        const cleanTitle = SecurityUtils.sanitizeText(res.titulo);
        const cleanDesc = SecurityUtils.sanitizeText(res.desc);
        const cleanEntrada = SecurityUtils.sanitizeText(res.entrada);
        const cleanSalida = SecurityUtils.sanitizeText(res.salida);
        const cleanPersonas = SecurityUtils.sanitizeText(String(res.personas));
        const cleanId = SecurityUtils.sanitizeText(res.id);

        wrapper.innerHTML = `
          <article class="box-card">
            <div class="reserva-card-header">
              <div>
                <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--texto-oscuro);">${cleanTitle}</h2>
                <p style="font-weight: 700; margin: 6px 0 4px 0;">Descripción</p>
                <p style="color: var(--texto-etiqueta); font-size: 0.9rem; line-height: 1.4;">${cleanDesc}</p>
              </div>
              <img src="${res.imagen}" alt="${cleanTitle}">
            </div>

            <div class="three-col-info">
              <div>
                <p style="font-weight: 700; font-size: 0.85rem;">Fecha de entrada</p>
                <p style="color: var(--texto-etiqueta); margin-top: 4px;">${cleanEntrada}</p>
              </div>
              <div>
                <p style="font-weight: 700; font-size: 0.85rem;">Fecha de salida</p>
                <p style="color: var(--texto-etiqueta); margin-top: 4px;">${cleanSalida}</p>
              </div>
              <div>
                <p style="font-weight: 700; font-size: 0.85rem;">Huéspedes</p>
                <p style="color: var(--texto-etiqueta); margin-top: 4px;">${cleanPersonas} personas</p>
              </div>
            </div>

            <p style="font-weight: 700; margin-top: 10px;">Detalles incluidos</p>
            <div class="services-grid">
              <div class="service-item">✔ Wi-Fi incluido</div>
              <div class="service-item">✔ Desayuno americano</div>
              <div class="service-item">✔ Aire acondicionado</div>
              <div class="service-item">✔ Check-in flexible</div>
            </div>
          </article>

          <div class="two-col-inputs" style="margin-bottom: 16px;">
            <button type="button" class="btn btn-blue" data-action="modificar" data-id="${cleanId}">Modificar reserva</button>
            <button type="button" class="btn btn-outline-blue" data-action="cancelar" data-id="${cleanId}">Cancelar reserva</button>
          </div>
        `;
        container.appendChild(wrapper);
      });
    }

    async function modificarReserva(id) {
      const lista = getReservas();
      const item = lista.find((r) => r.id === id);
      if (!item) return;

      const nuevaSalida = await UI.prompt(
        'Modificar Reserva',
        `Selecciona la nueva fecha de salida para "${item.titulo}":`,
        item.salida,
        'date',
        { min: item.entrada }
      );

      if (nuevaSalida) {
        if (nuevaSalida <= item.entrada) {
          UI.toast('La fecha de salida debe ser posterior a la fecha de entrada.', 'error');
          return;
        }
        item.salida = nuevaSalida;
        localStorage.setItem(getStorageKey(), JSON.stringify(lista));
        renderMisReservas();
        UI.toast('¡Reserva modificada con éxito!', 'success');
      }
    }

    async function cancelarReserva(id) {
      const lista = getReservas();
      const item = lista.find((r) => r.id === id);
      if (!item) return;

      const confirmado = await UI.confirm(
        'Cancelar Reserva',
        `¿Estás segura de que deseas cancelar tu reserva para "${item.titulo}"? Esta acción no se puede deshacer.`
      );

      if (confirmado) {
        // Mover a historial como cancelada
        const histKey = SecurityUtils.getUserStorageKey('historial_reservas');
        const historial = JSON.parse(localStorage.getItem(histKey) || '[]');
        item.estado = 'Cancelada';
        item.fechaCancelacion = SecurityUtils.getLocalDateString();
        historial.unshift(item);
        localStorage.setItem(histKey, JSON.stringify(historial));

        // Remover de activas
        const nuevaLista = lista.filter((r) => r.id !== id);
        localStorage.setItem(getStorageKey(), JSON.stringify(nuevaLista));
        renderMisReservas();
        UI.toast('Reserva cancelada correctamente.', 'info');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderMisReservas();

      // Delegación de eventos segura sin inline onclick (Cumple CSP)
      const container = document.getElementById('reservasList');
      container.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;

        const action = btn.dataset.action;
        const id = btn.dataset.id;

        if (action === 'modificar') {
          modificarReserva(id);
        } else if (action === 'cancelar') {
          cancelarReserva(id);
        }
      });
    });
  </script>
</body>
</html>
